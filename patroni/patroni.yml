scope: hadb
namespace: /service/

restapi:
  listen: 0.0.0.0:8008

bootstrap:
  dcs:
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 1048576        # 1 MB: una réplica más atrasada no puede ser promovida
    synchronous_mode: true                   # cada COMMIT confirmado está en ≥ 2 nodos
    synchronous_mode_strict: false
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_log_hints: "on"
        max_connections: 100
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 1GB                   # margen si un nodo pasa mucho tiempo desconectado
        synchronous_commit: "on"
        password_encryption: scram-sha-256
        log_min_duration_statement: 1000
  initdb:
    - encoding: UTF8
    - locale: C.UTF-8
    - data-checksums

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/patroni
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/pgpass0
  parameters:
    unix_socket_directories: /var/run/postgresql
  pg_hba:
    - local   all          all                       trust
    - host    replication  replicator  0.0.0.0/0     scram-sha-256
    - host    all          all         127.0.0.1/32  scram-sha-256
    - host    all          all         0.0.0.0/0     scram-sha-256

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
